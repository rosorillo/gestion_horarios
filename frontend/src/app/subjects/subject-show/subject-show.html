<div class="container mt-4">

  @if (cargando()) {
    <p>Cargando...</p>
  } @else {

    @if (subject()) {
      <div class="card">
        <div class="card-header">
          <h3>{{ subject()!.nombre }}</h3>
        </div>

        <div class="card-body">
          <p><strong>ID:</strong> {{ subject()!.id }}</p>
          <p><strong>Creada:</strong> {{ subject()!.created_at | date:'fullDate' }}</p>
          <p><strong>Actualizada:</strong> {{ subject()!.updated_at | date:'fullDate' }}</p>
        </div>

        <div class="card-footer">
          <a routerLink="/asignaturas" class="btn btn-secondary">Volver</a>
        </div>
      </div>
    } @else {
      <div class="alert alert-warning">No se encontró la asignatura.</div>
      <a routerLink="/asignaturas" class="btn btn-secondary">Volver</a>
    }

  }

</div>
