<div class="container my-4">
  <h2 class="mb-4">Entrar en el sistema</h2>

  <form [formGroup]="loginForm" (ngSubmit)="login()" method="POST">

    <!-- Campo email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        id="email"
        formControlName="email"
        placeholder="correo@ejemplo.com"

      >
    </div>
    <input
      type="password"
      class="form-control"
      id="password"
      formControlName="password"
      placeholder="Contraseña"
      value=""
    >


    <!-- Acciones -->
    <div class="d-flex gap-2 m-2">
      <button type="submit" [disabled]="loginForm.invalid" class="btn btn-success">
        Entrar
      </button>

      <a [routerLink]="['/login']" class="btn btn-secondary">
        Volver
      </a>
    </div>
  </form>
</div>
