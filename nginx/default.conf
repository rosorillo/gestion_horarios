# Redirigir todo el tráfico HTTP a HTTPS
server {
    listen 80;
    server_name gestion-profes.es www.gestion-profes.es;

    return 301 https://$host$request_uri;
}

# Configuración del servidor HTTPS
server {
    listen 443 ssl;
    server_name gestion-profes.es www.gestion-profes.es;

    # Rutas absolutas dentro del contenedor según tu docker-compose.yml
    ssl_certificate /etc/nginx/ssl/gestion.crt;
    ssl_certificate_key /etc/nginx/ssl/gestion.key;

    # Enruta el tráfico principal al contenedor del frontend
    location / {
        proxy_pass http://frontend:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enruta las peticiones de la API al contenedor del backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /phpmyadmin/ {
	proxy_pass http://phpmyadmin:80/;
	proxy_set_header Host $host;
	proxy_set_header X-Real_IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	
	proxy_redirect / /phpmyadmin/;
    }	
}
